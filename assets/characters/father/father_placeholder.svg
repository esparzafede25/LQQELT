<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600">
  <!-- Father - Carved wood puppet placeholder -->
  <!-- Sturdy Boots -->
  <rect x="105" y="530" width="45" height="35" rx="6" fill="#4a3321" stroke="#26170b" stroke-width="2"/>
  <rect x="150" y="530" width="45" height="35" rx="6" fill="#402a1a" stroke="#26170b" stroke-width="2"/>
  <!-- Work Trousers -->
  <rect x="115" y="320" width="32" height="220" rx="6" fill="#2c2724" stroke="#161311" stroke-width="2"/>
  <rect x="153" y="320" width="32" height="220" rx="6" fill="#25211e" stroke="#161311" stroke-width="2"/>
  <!-- Leather Belt with brass buckle -->
  <rect x="110" y="315" width="80" height="12" fill="#1d150f"/>
  <rect x="144" y="313" width="12" height="16" fill="none" stroke="#bfa15f" stroke-width="2"/>

  <!-- Weathered Work Jacket (Brown/Ochre) -->
  <path d="M 90 170 C 90 170 65 190 60 310 L 95 320 L 115 325 L 185 325 L 205 320 L 240 310 C 235 190 210 170 210 170 Z" fill="#75502c" stroke="#36220e" stroke-width="2.5"/>
  <path d="M 125 170 L 150 210 L 175 170 Z" fill="#45382e" stroke="#221b16" stroke-width="1.5"/>

  <!-- Solid Carved Head -->
  <rect x="138" y="145" width="24" height="30" rx="4" fill="#a87f58" stroke="#48321e" stroke-width="2"/>
  <polygon points="120,65 180,65 175,145 150,158 125,145" fill="#ba9067" stroke="#48321e" stroke-width="2.5"/>
  <!-- Gentle, calm eyes -->
  <ellipse cx="137" cy="98" rx="5" ry="6" fill="#fff" stroke="#48321e" stroke-width="1.5"/>
  <ellipse cx="163" cy="98" rx="5" ry="6" fill="#fff" stroke="#48321e" stroke-width="1.5"/>
  <circle cx="137" cy="99" r="3" fill="#2e1b0c"/>
  <circle cx="163" cy="99" r="3" fill="#2e1b0c"/>
  <!-- Calm straight eyebrows -->
  <path d="M 130 88 L 144 90" stroke="#1f1813" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 156 90 L 170 88" stroke="#1f1813" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Nose & Smile lines -->
  <polygon points="150,92 146,115 153,117" fill="#996e46"/>
  <path d="M 140 128 Q 150 132 160 128" stroke="#52361d" stroke-width="2" fill="none"/>
  <!-- Short neat sculpted hair -->
  <path d="M 116 70 Q 120 45 150 48 Q 180 45 184 70 Q 188 52 150 40 Q 112 52 116 70" fill="#26201b" stroke="#110d0a" stroke-width="2"/>

  <!-- Strong carved wooden hands with tool marks -->
  <rect x="52" y="300" width="18" height="38" rx="3" fill="#ba9067" stroke="#48321e" stroke-width="1.5"/>
  <rect x="230" y="300" width="18" height="38" rx="3" fill="#ba9067" stroke="#48321e" stroke-width="1.5"/>
</svg>
