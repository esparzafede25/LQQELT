<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 580" width="300" height="580">
  <!-- VALENTINO A LOS 18 AÑOS (RECUERDO: EL AUTO / TALLER) -->
  <!-- Estilo: Madera tallada artesanal, joven adulto con mangas arremangadas y manos con marcas de trabajo -->
  <defs>
    <filter id="woodGrain18">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="grain"/>
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.22 0"/>
      <feBlend mode="multiply" in="SourceGraphic"/>
    </filter>
  </defs>

  <g id="valentino-18yo" filter="url(#woodGrain18)">
    <!-- Piernas / Pantalón de trabajo azul oscuro gastado -->
    <rect x="122" y="315" width="24" height="215" rx="5" fill="#323b46" stroke="#161c24" stroke-width="2"/>
    <rect x="154" y="315" width="24" height="215" rx="5" fill="#2b323c" stroke="#161c24" stroke-width="2"/>
    
    <!-- Borcegos o zapatillas oscuras de taller -->
    <rect x="110" y="525" width="40" height="24" rx="5" fill="#201c18" stroke="#111" stroke-width="2"/>
    <rect x="150" y="525" width="40" height="24" rx="5" fill="#1c1815" stroke="#111" stroke-width="2"/>

    <!-- Camisa o campera liviana con mangas arremangadas -->
    <path d="M 104 175 C 104 175 80 195 76 270 L 105 285 L 125 295 L 175 295 L 195 285 L 224 270 C 220 195 196 175 196 175 Z" fill="#394858" stroke="#17222c" stroke-width="2.5"/>
    <path d="M 128 175 L 150 205 L 172 175 Z" fill="#69655f" stroke="#333" stroke-width="1.5"/>

    <!-- Brazos de madera visibles por mangas arremangadas -->
    <rect x="73" y="270" width="16" height="36" rx="3" fill="#c49d74" stroke="#48321e" stroke-width="1.5"/>
    <rect x="211" y="270" width="16" height="36" rx="3" fill="#c49d74" stroke="#48321e" stroke-width="1.5"/>
    <!-- Mancha de grasa sutil en el brazo derecho -->
    <ellipse cx="80" cy="285" rx="4" ry="7" fill="#241e18" opacity="0.6"/>

    <!-- Cuello largo y anguloso -->
    <rect x="140" y="145" width="20" height="34" rx="3" fill="#b08a65" stroke="#48321e" stroke-width="2"/>
    
    <!-- Rostro alargado de madera tallada (18 años) -->
    <polygon points="125,70 175,70 170,148 150,164 130,148" fill="#c49d74" stroke="#48321e" stroke-width="2.5"/>
    
    <!-- Ojos grandes y concentrados, aprendiendo del padre -->
    <ellipse cx="138" cy="100" rx="6.2" ry="8" fill="#fff" stroke="#48321e" stroke-width="1.5"/>
    <ellipse cx="162" cy="100" rx="6.2" ry="8" fill="#fff" stroke="#48321e" stroke-width="1.5"/>
    <circle cx="138" cy="101" r="3.7" fill="#3a2510"/>
    <circle cx="162" cy="101" r="3.7" fill="#3a2510"/>
    <circle cx="140" cy="99" r="1.2" fill="#fff"/>
    <circle cx="164" cy="99" r="1.2" fill="#fff"/>
    
    <!-- Cejas gruesas y firmes -->
    <path d="M 129 88 Q 140 84 146 89" stroke="#1a140f" stroke-width="4" stroke-linecap="round"/>
    <path d="M 154 89 Q 160 84 171 88" stroke="#1a140f" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Nariz recta y definida -->
    <polygon points="150,94 146,119 152,121" fill="#a47d57"/>
    <path d="M 144 134 L 156 134" stroke="#48321e" stroke-width="2"/>

    <!-- Cabello negro desordenado característico -->
    <path d="M 115 75 Q 120 40 150 42 Q 180 40 185 75 Q 195 55 175 35 Q 145 30 120 40 Q 105 60 115 75" fill="#1c1612" stroke="#000" stroke-width="2"/>

    <!-- Manos de madera tallada listas para sostener la llave de 10 mm -->
    <rect x="71" y="306" width="18" height="34" rx="3" fill="#c49d74" stroke="#48321e" stroke-width="1.5"/>
    <rect x="211" y="306" width="18" height="34" rx="3" fill="#c49d74" stroke="#48321e" stroke-width="1.5"/>
  </g>
</svg>
