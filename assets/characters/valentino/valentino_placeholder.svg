<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600">
  <defs>
    <filter id="woodCarving">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="grain"/>
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.25 0"/>
      <feBlend mode="multiply" in="SourceGraphic"/>
    </filter>
  </defs>
  <!-- Valentino - Carved wood puppet placeholder -->
  <!-- Legs / Dark Trousers -->
  <rect x="122" y="320" width="24" height="230" rx="6" fill="#3a3028" stroke="#1c1611" stroke-width="2"/>
  <rect x="154" y="320" width="24" height="230" rx="6" fill="#322822" stroke="#1c1611" stroke-width="2"/>
  <!-- Dark Sneakers -->
  <rect x="110" y="545" width="40" height="20" rx="5" fill="#222" stroke="#111" stroke-width="2"/>
  <rect x="150" y="545" width="40" height="20" rx="5" fill="#1e1e1e" stroke="#111" stroke-width="2"/>
  <ellipse cx="145" cy="558" rx="8" ry="4" fill="#eee"/>
  <ellipse cx="185" cy="558" rx="8" ry="4" fill="#eee"/>

  <!-- Denim Jacket & Knitted Sweater -->
  <path d="M 105 180 C 105 180 80 200 75 310 L 105 320 L 125 325 L 175 325 L 195 320 L 225 310 C 220 200 195 180 195 180 Z" fill="#2d3b4a" stroke="#151d24" stroke-width="2.5"/>
  <!-- Sweater neck collar -->
  <path d="M 130 180 L 150 205 L 170 180 Z" fill="#6d6a65" stroke="#333" stroke-width="1.5"/>

  <!-- Carved Wood Neck & Long Head -->
  <rect x="140" y="150" width="20" height="35" rx="3" fill="#b08a65" stroke="#48321e" stroke-width="2"/>
  <!-- Angular Carved Head -->
  <polygon points="125,70 175,70 170,150 150,165 130,150" fill="#c49d74" stroke="#48321e" stroke-width="2.5"/>
  <!-- Big Melancholy Eyes -->
  <ellipse cx="138" cy="100" rx="6" ry="8" fill="#fff" stroke="#48321e" stroke-width="1.5"/>
  <ellipse cx="162" cy="100" rx="6" ry="8" fill="#fff" stroke="#48321e" stroke-width="1.5"/>
  <circle cx="138" cy="101" r="3.5" fill="#3a2510"/>
  <circle cx="162" cy="101" r="3.5" fill="#3a2510"/>
  <!-- Thick expressive eyebrows -->
  <path d="M 130 88 Q 140 85 146 90" stroke="#1a140f" stroke-width="4" stroke-linecap="round"/>
  <path d="M 154 90 Q 160 85 170 88" stroke="#1a140f" stroke-width="4" stroke-linecap="round"/>
  <!-- Angular Nose -->
  <polygon points="150,95 146,120 152,122" fill="#a47d57"/>
  <!-- Messy curly dark hair -->
  <path d="M 115 75 Q 120 40 150 42 Q 180 40 185 75 Q 195 55 175 35 Q 145 30 120 40 Q 105 60 115 75" fill="#1c1612" stroke="#000" stroke-width="2"/>
  
  <!-- Canvas Backpack Straps -->
  <path d="M 110 185 L 115 310" stroke="#414c35" stroke-width="7" stroke-linecap="round"/>
  <path d="M 190 185 L 185 310" stroke="#414c35" stroke-width="7" stroke-linecap="round"/>

  <!-- Carved Wood Hands -->
  <rect x="70" y="305" width="16" height="35" rx="3" fill="#c49d74" stroke="#48321e" stroke-width="1.5"/>
  <rect x="214" y="305" width="16" height="35" rx="3" fill="#c49d74" stroke="#48321e" stroke-width="1.5"/>
</svg>
