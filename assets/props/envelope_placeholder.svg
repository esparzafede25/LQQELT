<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="envelopePaper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#f3ebd9"/>
      <stop offset="100%" stop-color="#e2d2ba"/>
    </linearGradient>
  </defs>
  <!-- Envelope Base -->
  <rect x="20" y="20" width="200" height="120" rx="3" fill="url(#envelopePaper)" stroke="#a38c6d" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Envelope Flap Creases -->
  <path d="M 20 20 L 120 90 L 220 20" fill="none" stroke="#ba9f7d" stroke-width="1.2"/>
  <path d="M 20 140 L 95 80" fill="none" stroke="#ba9f7d" stroke-width="1"/>
  <path d="M 220 140 L 145 80" fill="none" stroke="#ba9f7d" stroke-width="1"/>
  
  <!-- Handwritten Name: "Valentino" -->
  <text x="120" y="105" font-family="'Brush Script MT', 'Dancing Script', 'Caveat', cursive, Georgia" font-size="28" font-style="italic" fill="#2c221a" text-anchor="middle" letter-spacing="1">Valentino</text>
  
  <!-- Aged postmark stamp imprint -->
  <g transform="translate(180, 45) rotate(12)" opacity="0.6">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#4a3b32" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#4a3b32" stroke-width="0.8"/>
    <text x="0" y="-3" font-family="'Courier New', monospace" font-size="5" text-anchor="middle" fill="#4a3b32">CORREO</text>
    <text x="0" y="4" font-family="'Courier New', monospace" font-size="5" text-anchor="middle" fill="#4a3b32">17 OCT</text>
  </g>
</svg>
