<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfd4d8"/>
      <stop offset="35%" stop-color="#9aa0a6"/>
      <stop offset="70%" stop-color="#60666d"/>
      <stop offset="100%" stop-color="#3c4043"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-35 100 100)">
    <!-- Wrench handle -->
    <rect x="90" y="45" width="20" height="110" rx="3" fill="url(#steelGrad)" stroke="#2b2d30" stroke-width="1.5"/>
    <text x="100" y="105" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#202224" text-anchor="middle" transform="rotate(90 100 105)">10 mm</text>
    <!-- Open end (top) -->
    <path d="M 85 45 C 80 35 85 20 100 20 C 115 20 120 35 115 45 L 108 45 L 105 32 L 95 32 L 92 45 Z" fill="url(#steelGrad)" stroke="#2b2d30" stroke-width="1.5"/>
