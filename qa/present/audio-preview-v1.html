<!doctype html><html lang="es"><meta charset="utf-8"><title>Revisión sonora · Lo que queda en la Tierra</title><style>body{background:#111;color:#ddd;font:18px system-ui;max-width:850px;margin:40px auto}button{padding:14px}article{padding:12px;border:1px solid #555;margin:10px 0}audio{display:block}</style><h1>Primera pasada sonora</h1><p>Sonidos sintetizados del juego. Muestras a volumen de juego; todavía ajustables antes de grabar las voces.</p><button>Preparar muestras</button><p role="status">Sin preparar</p><main></main><script type="module">
import {AudioManager} from '../../scripts/AudioManager.js';
const labels={paper:'Papel y carta',leather:'Cuero de la mochila',cloth:'Ropa',ceramic:'Mate',metal:'Llave',door:'Puerta del auto',engine:'Arranque'};
document.querySelector('button').onclick=async()=>{
 const button=document.querySelector('button');button.disabled=true;
 try{for(const [kind,label]of Object.entries(labels)){
  const ctx=new OfflineAudioContext(1,44100*(kind==='engine'?1.1:.6),44100),audio=new AudioManager({get:key=>key==='volume'?.8:true});
  audio.ctx=ctx;audio.ensureContext=()=>{};audio.masterGain=ctx.createGain();audio.masterGain.gain.value=.8;audio.masterGain.connect(ctx.destination);audio.engineGain=ctx.createGain();audio.engineGain.connect(audio.masterGain);
  if(kind==='engine')audio.playCarStart();else audio.playPackingContact(kind);
  const buffer=await ctx.startRendering();audio.stopEngine();
  const samples=buffer.getChannelData(0);let peak=0,sum=0;for(const x of samples){peak=Math.max(peak,Math.abs(x));sum+=x*x;}
  if(peak<=0||peak>=1)throw Error(label+': nivel inválido');
  const bytes=new ArrayBuffer(44+samples.length*2),view=new DataView(bytes);const text=(at,s)=>[...s].forEach((c,n)=>view.setUint8(at+n,c.charCodeAt(0)));
  text(0,'RIFF');view.setUint32(4,36+samples.length*2,true);text(8,'WAVE');text(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,44100,true);view.setUint32(28,88200,true);view.setUint16(32,2,true);view.setUint16(34,16,true);text(36,'data');view.setUint32(40,samples.length*2,true);samples.forEach((x,i)=>view.setInt16(44+i*2,Math.max(-1,Math.min(1,x))*32767,true));
  const article=document.createElement('article'),name=document.createElement('p'),player=document.createElement('audio');name.textContent=label+' · pico '+peak.toFixed(4)+' · RMS '+Math.sqrt(sum/samples.length).toFixed(4)+' · sin saturación';player.controls=true;player.src=URL.createObjectURL(new Blob([bytes],{type:'audio/wav'}));article.append(name,player);document.querySelector('main').append(article);
 }document.querySelector('[role=status]').textContent='7 muestras renderizadas · niveles válidos';}
 catch(e){document.querySelector('[role=status]').textContent=e.message;button.disabled=false;}
};
</script></html>
