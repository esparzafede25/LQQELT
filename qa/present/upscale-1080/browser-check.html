<!doctype html><html lang="es"><meta charset="utf-8"><title>Verificación de las animaciones 1080</title><style>body{max-width:1200px;margin:24px auto;background:#0b1018;color:#dae2ec;font:16px system-ui}button{padding:14px}video{display:block;width:100%;max-height:68vh;background:black}li{margin:7px 0}.ok{color:#8ed6a1}.error{color:#ff9797}</style><h1>Animaciones del juego — verificación 1080</h1><p>Comprueba resolución, comienzo de reproducción y lectura del último cuadro de cada película.</p><button>Comprobar las 31 animaciones</button><p id="status" role="status">Listo para comprobar</p><video muted playsinline controls></video><ol></ol><script type="module">
const rows=await(await fetch('results.json')).json(),candidate=new URLSearchParams(location.search).has('candidate');const video=document.querySelector('video'),status=document.querySelector('#status'),list=document.querySelector('ol'),button=document.querySelector('button');
function event(name,timeout=12000){return new Promise((resolve,reject)=>{const done=()=>{clearTimeout(timer);video.removeEventListener(name,done);video.removeEventListener('error',fail);resolve();},fail=()=>{clearTimeout(timer);video.removeEventListener(name,done);video.removeEventListener('error',fail);reject(Error(video.error?.message||'Error de reproducción'));},timer=setTimeout(()=>{video.removeEventListener(name,done);video.removeEventListener('error',fail);reject(Error('Tiempo agotado '+name));},timeout);video.addEventListener(name,done,{once:true});video.addEventListener('error',fail,{once:true});});}
button.onclick=async()=>{button.disabled=true;list.replaceChildren();let passed=0;try{for(const r of rows){status.textContent=`Comprobando ${passed+1}/${rows.length}: ${r.file}`;video.pause();const loaded=event('loadeddata');video.src=(candidate&&r.status==='verified'?'output/':'../../../')+r.file;video.load();await loaded;if(video.videoHeight!==1080||video.videoWidth!==r.targetWidth)throw Error(`Resolución incorrecta ${r.file}: ${video.videoWidth}x${video.videoHeight}`);await video.play();await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Sin cuadro reproducido')),8000);video.requestVideoFrameCallback(()=>{clearTimeout(timer);resolve();});});video.pause();const sought=event('seeked');video.currentTime=Math.max(0,video.duration-.12);await sought;if(video.readyState<2)throw Error('Sin último cuadro');const li=document.createElement('li');li.className='ok';li.textContent=`OK ${video.videoWidth}×${video.videoHeight} · ${r.file}`;list.appendChild(li);passed++;}status.textContent=`PASS: ${passed}/${rows.length} películas, resolución 1080, reproducción y cuadros finales.`;}catch(e){const li=document.createElement('li');li.className='error';li.textContent=e.message;list.appendChild(li);status.textContent=`FAIL: ${passed}/${rows.length} · ${e.message}`;}finally{button.disabled=false;}};
</script></html>
