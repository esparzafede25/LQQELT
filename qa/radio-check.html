<!doctype html><html lang="es"><meta charset="utf-8"><base href="/"><title>Prueba de Radio</title><link rel="stylesheet" href="/styles/mate-film.css"><style>body{margin:0;background:#151515;color:#eee;font:15px system-ui}header{padding:12px}button{padding:8px}#stage{position:relative;height:680px}pre{white-space:pre-wrap;padding:12px}.mate-caption p{margin:0}</style>
<header><button id="run">Probar Radio completa</button><button id="cancel">Probar salida</button><button id="error">Probar reintento</button><span id="status">Listo</span></header><div id="stage"></div><pre id="report"></pre>
<script type="module">
import {RadioFilmScene} from '/scenes/RadioFilmScene.js';
let scene,results=[];const stage=document.querySelector('#stage'),report=document.querySelector('#report'),status=document.querySelector('#status');
const delay=ms=>new Promise(r=>setTimeout(r,ms));
function check(v,t){if(!v)throw new Error(t);results.push('PASS '+t);report.textContent=results.join('\n');}
async function until(fn,ms=45000){const start=performance.now();while(!fn()){if(performance.now()-start>ms)throw new Error('Tiempo agotado');await delay(100);}}
async function setup(){scene?.exit();stage.replaceChildren();results=[];report.textContent='';scene=new RadioFilmScene();scene.audio={playAtmosphere(){},stopAtmosphere(){},ensureContext(){},startRadioStatic(){},stopRadioStatic(){},tuneRadioDial(){}};scene.saved={};scene.storage={set(k,v){scene.saved[k]=v;}};scene.sceneManager={changeScene(n){scene.destination=n;scene.exit();}};await scene.enter(stage);scene.onVisible();await until(()=>scene.state==='ready');}
async function advance(){await until(()=>scene.advanceDialogue);await delay(400);document.querySelector('.mate-speech').click();}
function wrap(fn){return async()=>{document.querySelectorAll('header button').forEach(b=>b.disabled=true);status.textContent='En curso';try{await fn();status.textContent='PASS';}catch(e){status.textContent='FAIL';report.textContent+='\nFAIL '+e.message;}finally{document.querySelectorAll('header button').forEach(b=>b.disabled=false);}};}
document.querySelector('#run').onclick=wrap(async()=>{await setup();document.querySelector('#radio-power').click();scene.power();check(scene.state==='busy','Encendido bloquea clic repetido');await until(()=>scene.advanceDialogue);check(scene.videos.power.ended,'Encendido llega al final real');check(!scene.saved.RADIO_COMPLETED,'No guarda al encender');await advance();await until(()=>scene.state==='tuning');check(scene.listen.disabled,'Mala sintonía no permite seguir');scene.dial.value='950';scene.dial.dispatchEvent(new Event('input',{bubbles:true}));check(!scene.listen.disabled,'950 AM habilita escuchar');scene.listen.click();check(scene.state==='listening'&&scene.tuner.hidden,'Escuchar bloquea cambios de sintonía');const start=performance.now();let pages=0;while(scene.alive){if(performance.now()-start>45000)throw new Error('Conversación no termina');if(scene.advanceDialogue){await delay(400);document.querySelector('.mate-speech').click();pages++;}else await delay(100);}check(pages>=12,'Relato e interferencias esperan al lector');check(scene.saved.RADIO_COMPLETED&&scene.saved.LETTER_SEQUENCE_UNLOCKED,'Guarda recuerdo y desbloquea carta al terminar');check(scene.destination==='INTRO'&&scene.pending.size===0,'Regresa y cancela esperas');});
document.querySelector('#cancel').onclick=wrap(async()=>{await setup();document.querySelector('#radio-power').click();await delay(1500);scene.exit();await delay(10500);check(!scene.saved.RADIO_COMPLETED,'Salida temprana no guarda');check(scene.pending.size===0&&scene.videos.power.paused,'Salida cancela video y esperas');});
document.querySelector('#error').onclick=wrap(async()=>{await setup();scene.videos.power.src='/qa/missing-video.mp4';document.querySelector('#radio-power').click();await until(()=>scene.state==='media-error');check(!scene.saved.RADIO_COMPLETED&&!scene.mediaError.hidden,'Error ofrece reintento sin guardar');scene.videos.power.src='/assets/radio-cinematic/01-power.mp4';scene.mediaError.querySelector('button').click();await until(()=>scene.advanceDialogue);check(scene.videos.power.ended,'Reintento reproduce el movimiento');scene.exit();});
</script></html>
