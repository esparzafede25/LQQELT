<!doctype html><html lang="es"><meta charset="utf-8"><base href="/"><title>Prueba del recorrido del mate</title>
<link rel="stylesheet" href="/styles/mate-film.css"><style>body{margin:0;background:#151515;color:#eee;font:15px system-ui}header{padding:12px}button{padding:8px}#stage{position:relative;width:100%;height:680px}pre{white-space:pre-wrap;padding:12px}.mate-caption p{margin:0}</style>
<header><button id="run">Probar recorrido completo</button><button id="cancel">Probar salida durante acción</button><button id="failure">Probar error de video</button><span id="status">Listo</span></header><div id="stage"></div><pre id="report"></pre>
<script type="module">
import { MateScene, ACTIONS } from '/scenes/MateRouteScene.js';
const report = document.querySelector('#report'), status = document.querySelector('#status'), stage = document.querySelector('#stage');
let scene, results = [];
const delay = ms => new Promise(r => setTimeout(r, ms));
function check(condition, message) { if (!condition) throw new Error(message); results.push('PASS ' + message); report.textContent = results.join('\n'); }
async function until(fn, ms=45000) { const start=performance.now(); while(!fn()){ if(performance.now()-start>ms)throw new Error('Tiempo agotado'); await delay(100); } }
async function setup(){ if(scene)scene.exit(); stage.replaceChildren(); results=[]; report.textContent=''; scene=new MateScene(); scene.audio={playAtmosphere(){},stopAtmosphere(){},ensureContext(){},playPourWater(){},playMateSip(){}}; scene.storage={set(k,v){scene.saved=v;}}; scene.sceneManager={changeScene(name){scene.destination=name;scene.exit();}}; await scene.enter(stage); scene.onVisible(); await until(()=>scene.advanceDialogue); await delay(400); }
async function speak(text){await until(()=>document.querySelector('.mate-caption.visible p')?.textContent===text);await delay(400);document.querySelector('.mate-speech').click();}
function wrap(fn){return async()=>{document.querySelectorAll('header button').forEach(b=>b.disabled=true);status.textContent='En curso';try{await fn();status.textContent='PASS';}catch(e){status.textContent='FAIL';report.textContent+='\nFAIL '+e.message;}finally{document.querySelectorAll('header button').forEach(b=>b.disabled=false);}}}
document.querySelector('#run').onclick=wrap(async()=>{
 await setup(); await delay(1000);check(!!scene.advanceDialogue,'El diálogo espera al lector');await speak('Serví vos hoy.');
 const limit = Math.min(ACTIONS.length, Number(new URLSearchParams(location.search).get('steps')) || ACTIONS.length); for(let i=0;i<limit;i++){
  const action=ACTIONS[i];await until(()=>scene.state==='ready');await scene.panTo(action.zone);check(Math.abs(scene.camera-action.zone)<1,'Cámara llega a '+action.id);
  document.querySelector('#mate-'+action.id).click();check(scene.state==='busy','Acción '+action.id+' bloquea nuevos clics');const step=scene.step;scene.perform(action.id);check(scene.step===step,'Clic repetido no duplica '+action.id);
  await until(()=>scene.frame.dataset.playback==='held'||scene.state==='media-error');check(scene.state!=='media-error','Video '+action.id+' se reproduce');check(scene.videos[action.id].ended,'Video '+action.id+' llega a su final');
  if(action.id==='pour'){await speak('Eso.');await speak('Despacito.');}
  if(action.id==='pass'){await speak('¿Está bien?');await speak('Está bueno.');await speak('Tomá.');}
  if(action.id!=='return')check(!scene.saved,'No guarda antes del cierre de '+action.id);
 }
 if(limit===ACTIONS.length){await until(()=>scene.destination==='INTRO');check(scene.saved===true,'Guarda al completar');check(!scene.alive,'Cancela al salir');}else{await until(()=>scene.step===limit);check(scene.state==='ready','Recorrido parcial devuelve el control');}
});
document.querySelector('#cancel').onclick=wrap(async()=>{await setup();await speak('Serví vos hoy.');await until(()=>scene.state==='ready');document.querySelector('#mate-mate').click();await delay(1800);scene.exit();stage.replaceChildren();await delay(10500);check(!scene.saved,'Salir a mitad de acción no guarda');check(!scene.alive&&scene.pending.size===0,'Salida cancela todas las esperas');check(Object.values(scene.videos).every(v=>v.paused),'Salida pausa todos los videos');});
document.querySelector('#failure').onclick=wrap(async()=>{await setup();await speak('Serví vos hoy.');await until(()=>scene.state==='ready');scene.videos.mate.src='/qa/missing-video.mp4';document.querySelector('#mate-mate').click();await until(()=>scene.state==='media-error');check(scene.step===0&&!scene.saved,'Recurso fallido no adelanta ni guarda');check(!scene.mediaError.hidden,'Recurso fallido ofrece reintento');scene.videos.mate.src='/assets/mate-route/01-mate.mp4';scene.mediaError.querySelector('button').click();await until(()=>scene.step===1);check(scene.state==='ready','Reintento reproduce y devuelve el control');});
</script></html>
